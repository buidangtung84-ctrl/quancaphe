name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}       # chỉ hostname, ví dụ ftpupload.net
          username: ${{ secrets.FTP_USERNAME }} # user FTP của Hostinger
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/              # thư mục gốc website trên Hostinger
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
